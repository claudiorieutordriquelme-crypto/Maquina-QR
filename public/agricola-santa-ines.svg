<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Agrícola Santa Inés">
  <title>Agrícola Santa Inés</title>

  <!--
    Redibujo vectorial del logo de Agricola Santa Ines.

    El original entregado es un raster de unos 150 px de lado, con bordes
    pixelados y fondo blanco quemado. Servia para un correo y no para una
    interfaz: en una pantalla moderna se ve borroso, y en una etiqueta adhesiva
    impresa a 300 dpi se ve peor todavia.

    Este SVG es la misma marca reconstruida con curvas, asi que escala sin
    perder nitidez desde el favicon de 16 px hasta una etiqueta impresa. El
    fondo es transparente, no blanco, para que se pueda montar sobre cualquier
    superficie.

    Las hojas van en dos tonos, como el original: la de la izquierda mas clara y
    la de la derecha mas oscura, con la nervadura central en blanco recortando
    la hoja oscura.

    Los tonos verdes viven SOLO en este archivo. La interfaz de la aplicacion no
    los usa: su paleta esta en src/app/globals.css. Eso es a proposito, para que
    la marca del cliente y la paleta del producto se puedan decidir por separado.
  -->

  <defs>
    <linearGradient id="hojaClara" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5CE4E" />
      <stop offset="1" stop-color="#7FB539" />
    </linearGradient>
    <linearGradient id="hojaOscura" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3E8E41" />
      <stop offset="1" stop-color="#256A2E" />
    </linearGradient>
  </defs>

  <!-- Hoja izquierda, clara: curva ancha que nace abajo al centro. -->
  <path
    d="M100 128 C 62 122, 34 96, 30 58 C 62 44, 92 58, 104 88 C 108 100, 106 116, 100 128 Z"
    fill="url(#hojaClara)"
  />

  <!-- Hoja derecha, oscura: mas estilizada y algo mas alta. -->
  <path
    d="M100 128 C 104 92, 128 62, 168 52 C 172 92, 148 120, 108 130 C 105 130, 102 129, 100 128 Z"
    fill="url(#hojaOscura)"
  />

  <!-- Nervadura: recorta la hoja oscura, como en el original. -->
  <path
    d="M101 129 C 112 106, 134 82, 162 66 C 138 88, 116 110, 105 130 Z"
    fill="#FFFFFF"
  />

  <!-- Wordmark. Barlow, la misma familia del resto del producto. -->
  <text
    x="100"
    y="164"
    text-anchor="middle"
    font-family="Barlow, 'Segoe UI', system-ui, sans-serif"
    font-size="27"
    font-weight="600"
    fill="#4C9A3D"
  >Agrícola</text>
  <text
    x="100"
    y="190"
    text-anchor="middle"
    font-family="Barlow, 'Segoe UI', system-ui, sans-serif"
    font-size="27"
    font-weight="600"
    fill="#4C9A3D"
  >Santa Inés</text>
</svg>
